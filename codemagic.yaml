
      - name: Export signed IPA
        script: |
          set -e

          echo "========== XCODE VERSION =========="
          xcodebuild -version

          echo "========== AVAILABLE EXPORT METHODS =========="
          xcodebuild -help 2>&1 | grep -i -A 2 -B 2 -E 'app-store-connect|app-store|exportOptionsPlist' || true

          echo "========== EXPORT OPTIONS PLIST =========="
          plutil -p "$PWD/exportOptions.plist"

          echo "========== ARCHIVE INFO =========="
          xcodebuild -showBuildSettings \
            -workspace "$(cat /tmp/tabarak_workspace.txt)" \
            -scheme "$(cat /tmp/tabarak_scheme.txt)" \
            -configuration Release 2>&1 | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE' || true

          exit 1
