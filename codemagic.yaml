
workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          set -e
          pod install

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Select Tabarak Pharma scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found."
            find . -name "*.xcworkspace" -print
            exit 1
          fi

          echo "========== AVAILABLE SCHEMES =========="
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME="تبارك فارما"

          if ! xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -Fq "$SCHEME"; then
            echo "ERROR: Scheme '$SCHEME' was not found."
            echo "Check the available schemes printed above."
            exit 1
          fi

          echo "Selected app scheme: $SCHEME"
          echo "Workspace: $WORKSPACE"

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

      - name: Archive Tabarak Pharma app
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            archive

      - name: Verify application archive
        script: |
          set -e

          ARCHIVE="$PWD/build/TabarakPharma.xcarchive"
          APP="$ARCHIVE/Products/Applications"

          if [ ! -d "$APP" ]; then
            echo "ERROR: No iOS application was created."
            echo "Archive information:"
            plutil -p "$ARCHIVE/Info.plist" || true
            exit 1
          fi

          echo "========== APPLICATIONS =========="
          find "$APP" -maxdepth 1 -name "*.app" -print

          APP_BUNDLE=$(find "$APP" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: App bundle not found."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_BUNDLE/Info.plist")

          echo "Application: $APP_BUNDLE"
          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.tabarakpharma" ]; then
            echo "ERROR: Incorrect bundle identifier."
            exit 1
          fi

          echo "Application archive verified successfully."

      - name: Create export options
        script: |
          set -e

          cat > "$PWD/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>26P3HVTQKC</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tabarakpharma</key>
                  <string>Tabarak Pharma App Store 2</string>
              </dict>
          </dict>
          </plist>
          PLIST

          plutil -lint "$PWD/exportOptions.plist"

      - name: Export signed IPA
        script: |
          set -e

          mkdir -p "$PWD/build/ios/ipa"

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$PWD/exportOptions.plist"

          IPA=$(find "$PWD/build/ios/ipa" -maxdepth 1 -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "SUCCESS: $IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
