
workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          set -e
          pod install

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Find workspace and scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            echo "Available workspaces:"
            find . -name "*.xcworkspace" -print
            exit 1
          fi

          echo "========== XCODE VERSION =========="
          xcodebuild -version

          echo "========== WORKSPACE AND SCHEMES =========="
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '
            /Schemes:/ { found=1; next }
            found && NF {
              sub(/^[[:space:]]+/, "")
              print
              exit
            }
          ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Xcode scheme not found."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

      - name: Create export options
        script: |
          set -e

          cat > "$PWD/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>26P3HVTQKC</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tabarakpharma</key>
                  <string>Tabarak Pharma App Store</string>
              </dict>
          </dict>
          </plist>
          PLIST

          plutil -lint "$PWD/exportOptions.plist"

      - name: Archive iOS app
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            archive

      - name: Diagnose archive contents
        script: |
          set -e

          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== ARCHIVE PATHS =========="
          find "$PWD/build" -maxdepth 6 -name "*.xcarchive" -print || true

          ARCHIVE="$PWD/build/TabarakPharma.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Expected archive not found."
            echo "Searching the repository for archives..."
            find "$PWD" -maxdepth 8 -name "*.xcarchive" -print || true
            exit 1
          fi

          echo "========== ARCHIVE CONTENTS =========="
          find "$ARCHIVE" -maxdepth 5 -print | head -200

          echo "========== APPLICATION BUNDLES =========="
          find "$ARCHIVE" -name "*.app" -print

          echo "========== ARCHIVE INFO =========="
          if [ -f "$ARCHIVE/Info.plist" ]; then
            plutil -p "$ARCHIVE/Info.plist"
          else
            echo "Archive Info.plist not found."
          fi

          echo "========== VERIFY APP BUNDLE ID =========="
          APP=""

          while IFS= read -r CANDIDATE; do
            if [ -f "$CANDIDATE/Info.plist" ]; then
              BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$CANDIDATE/Info.plist" 2>/dev/null || true)

              echo "Found app: $CANDIDATE"
              echo "Bundle ID: $BUNDLE_ID"

              if [ "$BUNDLE_ID" = "com.tabarakpharma" ]; then
                APP="$CANDIDATE"
                break
              fi
            fi
          done < <(find "$ARCHIVE" -name "*.app" -type d -print)

          if [ -z "$APP" ]; then
            echo "ERROR: App bundle com.tabarakpharma was not found in archive."
            exit 1
          fi

          echo "Verified app bundle: $APP"
          echo "$APP" > /tmp/tabarak_app_path.txt

      - name: Export signed IPA
        script: |
          set -e

          ARCHIVE="$PWD/build/TabarakPharma.xcarchive"
          EXPORT_DIR="$PWD/build/ios/ipa"

          mkdir -p "$EXPORT_DIR"

          echo "========== XCODE VERSION =========="
          xcodebuild -version

          echo "========== EXPORT OPTIONS =========="
          plutil -p "$PWD/exportOptions.plist"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$PWD/exportOptions.plist"

          echo "========== GENERATED IPA FILES =========="
          find "$EXPORT_DIR" -maxdepth 1 -name "*.ipa" -print

          IPA=$(find "$EXPORT_DIR" -maxdepth 1 -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "SUCCESS: IPA generated at $IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
