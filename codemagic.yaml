
workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          set -e
          pod install

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Find workspace and scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          echo "========== XCODE VERSION =========="
          xcodebuild -version

          echo "========== WORKSPACE AND SCHEMES =========="
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '
            /Schemes:/ { found=1; next }
            found && NF {
              sub(/^[[:space:]]+/, "")
              print
              exit
            }
          ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

      - name: Create export options
        script: |
          set -e

          cat > "$PWD/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>26P3HVTQKC</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tabarakpharma</key>
                  <string>Tabarak Pharma App Store</string>
              </dict>
          </dict>
          </plist>
          PLIST

          plutil -lint "$PWD/exportOptions.plist"

      - name: Archive iOS app
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            archive

      - name: Verify archive application
        script: |
          set -e

          ARCHIVE="$PWD/build/TabarakPharma.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive not found."
            exit 1
          fi

          echo "========== ARCHIVED APPLICATIONS =========="
          find "$ARCHIVE/Products/Applications" -maxdepth 2 -name "*.app" -print

          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No application found inside archive."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")

          if [ "$BUNDLE_ID" != "com.tabarakpharma" ]; then
            echo "ERROR: Expected com.tabarakpharma but found $BUNDLE_ID"
            exit 1
          fi

          echo "Archive bundle ID verified: $BUNDLE_ID"

      - name: Export signed IPA
        script: |
          set -e

          mkdir -p "$PWD/build/ios/ipa"

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$PWD/exportOptions.plist"

          echo "========== GENERATED IPA FILES =========="
          find "$PWD/build/ios/ipa" -maxdepth 1 -name "*.ipa" -print

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
