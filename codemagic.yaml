
workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install

      - name: Build iOS simulator app
        script: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{getline; sub(/^[[:space:]]+/, ""); print; exit}')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
