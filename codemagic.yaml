
workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Clean and install CocoaPods dependencies
        script: |
          set -e

          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

          pod install

          test -f Podfile.lock
          test -d Pods

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"""(?<!\S)-framework\s+["']?Pods_{4,}["']?""")

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in {".git", "build"} for part in path.parts):
                  continue
              if path.suffix not in {
                  ".xcconfig", ".pbxproj", ".yaml",
                  ".yml", ".sh", ".txt"
              }:
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              updated, count = pattern.subn("", original)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Patched {path}: removed {count} invalid flag(s)")

          remaining = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in {".git", "build"} for part in path.parts):
                  continue
              if path.suffix not in {
                  ".xcconfig", ".pbxproj", ".yaml",
                  ".yml", ".sh", ".txt"
              }:
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              if pattern.search(content):
                  remaining.append(str(path))

          if remaining:
              print("Invalid linker flags remain:", remaining)
              raise SystemExit(1)

          print("CocoaPods linker flag check passed.")
          PY

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Select Tabarak Pharma scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found."
            find . -name "*.xcworkspace" -print
            exit 1
          fi

          SCHEME="تبارك فارما"

          xcodebuild -list -workspace "$WORKSPACE"

          if ! xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -Fq "$SCHEME"; then
            echo "ERROR: Scheme '$SCHEME' was not found."
            exit 1
          fi

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Diagnose linker settings
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          echo "========== PROJECT LINKER REFERENCES =========="
          grep -n -C 2 "Pods____________" \
            "تبارك فارما.xcodeproj/project.pbxproj" || true

          echo "========== EFFECTIVE RELEASE LINKER SETTINGS =========="
          xcodebuild \
            -showBuildSettings \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            | grep -E -A 3 -B 2 \
              "OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|PODS_ROOT" || true

      - name: Build signed Tabarak Pharma IPA
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"

          echo "========== VERIFY IPA OUTPUT =========="
          find build -type f -name "*.ipa" -print

          IPA=$(find build -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "IPA generated: $IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
