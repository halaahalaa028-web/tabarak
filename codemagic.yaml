workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Clean and install CocoaPods dependencies
        script: |
          set -e

          echo "========== CLEAN COCOAPODS =========="
          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

          echo "========== INSTALL PODS =========="
          pod install

          test -f Podfile.lock
          test -d Pods

          echo "========== PATCH INVALID COCOAPODS LINKER FLAGS =========="
          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"""(?<!\S)-framework\s+["']?Pods_{4,}["']?""")
          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", "build"} for part in path.parts):
                  continue
              if path.suffix not in {".xcconfig", ".pbxproj", ".yaml", ".yml", ".sh", ".txt"}:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              updated, count = pattern.subn("", original)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(f"{path} (removed {count})")

          print("Files patched:", changed if changed else "none")

          remaining = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", "build"} for part in path.parts):
                  continue
              if path.suffix not in {".xcconfig", ".pbxproj", ".yaml", ".yml", ".sh", ".txt"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if pattern.search(content):
                  remaining.append(str(path))

          print("Remaining invalid linker flags:", remaining)
          if remaining:
              raise SystemExit("ERROR: Invalid aggregate CocoaPods linker flag remains.")
          PY

          find "Pods/Target Support Files" -maxdepth 2 \
            \( -name "*.xcconfig" -o -name "*.framework" \) -print

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Select Tabarak Pharma scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found."
            find . -name "*.xcworkspace" -print
            exit 1
          fi

          echo "========== AVAILABLE SCHEMES =========="
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME="تبارك فارما"

          if ! xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -Fq "$SCHEME"; then
            echo "ERROR: Scheme '$SCHEME' was not found."
            exit 1
          fi

          echo "Selected app scheme: $SCHEME"
          echo "Workspace: $WORKSPACE"

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

      - name: Diagnose linker settings
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          echo "========== PROJECT LINKER REFERENCES =========="
          grep -n -C 3 "Pods____________" \
            "تبارك فارما.xcodeproj/project.pbxproj" || true

          echo "========== GENERATED POD LINKER REFERENCES =========="
          grep -R -n "Pods____________" \
            "Pods/Target Support Files" || true

          echo "========== EFFECTIVE RELEASE LINKER SETTINGS =========="
          xcodebuild \
            -showBuildSettings \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            | grep -E -A 3 -B 2 \
              "OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|PODS_ROOT" || true

          echo "========== COCOAPODS FRAMEWORK REFERENCES =========="
          grep -n "Pods_تباركفارما.framework" \
            "تبارك فارما.xcodeproj/project.pbxproj" || true

      - name: Archive Tabarak Pharma app
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          mkdir -p "$PWD/build"

