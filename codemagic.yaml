workflows:
  tabarak-ios:
    name: Tabarak Pharma iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Banuvra-iOS-Package

    environment:
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabarakpharma

    scripts:
      - name: Clean and install CocoaPods dependencies
        script: |
          set -e

          echo "========== CLEAN COCOAPODS =========="

          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

          echo "========== INSTALL PODS =========="
          pod install

          echo "========== VERIFY POD INSTALLATION =========="
          test -f Podfile.lock
          test -d Pods

          echo "========== SEARCH INVALID FRAMEWORK REFERENCES =========="
          grep -R -n --exclude-dir=.git --exclude-dir=build \
            "Pods____________" . || true

          echo "========== GENERATED COCOAPODS FILES =========="
          find "Pods/Target Support Files" -maxdepth 2 \
            \( -name "*.xcconfig" -o -name "*.framework" \) -print

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Select Tabarak Pharma scheme
        script: |
          set -e

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Workspace not found."
            find . -name "*.xcworkspace" -print
            exit 1
          fi

          echo "========== AVAILABLE SCHEMES =========="
          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME="تبارك فارما"

          if ! xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -Fq "$SCHEME"; then
            echo "ERROR: Scheme '$SCHEME' was not found."
            exit 1
          fi

          echo "Selected app scheme: $SCHEME"
          echo "Workspace: $WORKSPACE"

          echo "$WORKSPACE" > /tmp/tabarak_workspace.txt
          echo "$SCHEME" > /tmp/tabarak_scheme.txt

      - name: Diagnose linker settings
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          echo "========== PROJECT LINKER REFERENCES =========="
          grep -n -C 3 "Pods____________" \
            "تبارك فارما.xcodeproj/project.pbxproj" || true

          echo "========== GENERATED POD LINKER REFERENCES =========="
          grep -R -n "Pods____________" \
            "Pods/Target Support Files" || true

          echo "========== EFFECTIVE RELEASE LINKER SETTINGS =========="
          xcodebuild \
            -showBuildSettings \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            | grep -E -A 3 -B 2 \
              "OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|PODS_ROOT" || true

          echo "========== COCOAPODS FRAMEWORK REFERENCES =========="
          grep -n "Pods_تباركفارما.framework" \
            "تبارك فارما.xcodeproj/project.pbxproj" || true

      - name: Archive Tabarak Pharma app
        script: |
          set -e

          WORKSPACE=$(cat /tmp/tabarak_workspace.txt)
          SCHEME=$(cat /tmp/tabarak_scheme.txt)

          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TabarakPharma.xcarchive" \
            archive

      - name: Verify application archive
        script: |
          set -e

          ARCHIVE="$PWD/build/TabarakPharma.xcarchive"
          APP="$ARCHIVE/Products/Applications"

          if [ ! -d "$APP" ]; then
            echo "ERROR: No iOS application was created."
            plutil -p "$ARCHIVE/Info.plist" || true
            exit 1
          fi

          echo "========== APPLICATIONS =========="
          find "$APP" -maxdepth 1 -name "*.app" -print

          APP_BUNDLE=$(find "$APP" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: App bundle not found."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$APP_BUNDLE/Info.plist")

          echo "Application: $APP_BUNDLE"
          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.tabarakpharma" ]; then
